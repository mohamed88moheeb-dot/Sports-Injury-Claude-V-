<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sports Injury Platform Zoomable System Map</title>
  <style>
    :root {
      --canvas: #eef6ff;
      --surface: #ffffff;
      --surface-soft: #f7fbff;
      --ink: #0f1b2e;
      --ink-2: #243550;
      --ink-3: #3d5878;
      --muted: #6080a0;
      --line: #c8dcf5;
      --primary: #3b7dd8;
      --primary-dark: #2d68c0;
      --primary-soft: #eaf1fb;
      --green: #15834d;
      --green-soft: #e9f7ef;
      --amber: #a96b00;
      --amber-soft: #fff4db;
      --red: #b83d3d;
      --red-soft: #ffe8e8;
      --purple: #6758c7;
      --purple-soft: #efedff;
      --shadow: 0 18px 48px rgba(40, 90, 180, 0.16);
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 0%, rgba(59, 125, 216, 0.22), transparent 34rem),
        linear-gradient(180deg, #eef6ff 0%, #ffffff 86%);
    }

    button, input { font: inherit; }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .map-wrap {
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .map-wrap.dragging { cursor: grabbing; }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid-line {
      stroke: rgba(96, 128, 160, 0.16);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .edge {
      fill: none;
      stroke: rgba(45, 104, 192, 0.42);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge.dashed {
      stroke-dasharray: 12 10;
      stroke: rgba(103, 88, 199, 0.48);
    }

    .edge-label {
      fill: var(--ink-3);
      font-size: 19px;
      font-weight: 800;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .node-card {
      height: 100%;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 10px 26px rgba(40, 90, 180, 0.12);
      overflow: hidden;
      cursor: pointer;
    }

    .node-card:hover {
      border-color: rgba(59, 125, 216, 0.55);
      box-shadow: 0 16px 34px rgba(40, 90, 180, 0.18);
    }

    .node-card.existing { border-color: rgba(21, 131, 77, 0.34); background: linear-gradient(180deg, #fff, var(--green-soft)); }
    .node-card.partial { border-color: rgba(169, 107, 0, 0.36); background: linear-gradient(180deg, #fff, var(--amber-soft)); }
    .node-card.missing { border-color: rgba(184, 61, 61, 0.34); background: linear-gradient(180deg, #fff, var(--red-soft)); }
    .node-card.governance { border-color: rgba(103, 88, 199, 0.34); background: linear-gradient(180deg, #fff, var(--purple-soft)); }
    .node-card.engine { border-color: rgba(59, 125, 216, 0.34); background: linear-gradient(180deg, #fff, var(--primary-soft)); }

    .node-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .node-kicker {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .node-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(96, 128, 160, 0.2);
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .node-title {
      margin: 0;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.04;
      letter-spacing: -0.035em;
    }

    .node-body {
      margin: 8px 0 0;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.42;
    }

    .node-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .node-list span {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--ink-2);
      font-size: 11px;
      font-weight: 750;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: grid;
      gap: 12px;
      width: min(520px, calc(100vw - 36px));
      pointer-events: none;
    }

    .title-card,
    .controls,
    .legend,
    .drawer,
    .minimap {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.6);
      -webkit-backdrop-filter: blur(18px) saturate(1.6);
    }

    .title-card {
      padding: 18px;
    }

    .eyebrow {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 11px 0 7px;
      color: var(--ink);
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .title-card p {
      margin: 0;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px;
      pointer-events: auto;
    }

    .controls button,
    .focus-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
    }

    .controls button:hover,
    .focus-btn:hover {
      border-color: rgba(59, 125, 216, 0.52);
      color: var(--primary-dark);
    }

    .zoom-readout {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      min-width: 52px;
      text-align: center;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      pointer-events: auto;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .dot.existing { background: var(--green); }
    .dot.partial { background: var(--amber); }
    .dot.missing { background: var(--red); }
    .dot.governance { background: var(--purple); }

    .focus-strip {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 12;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
    }

    .focus-btn {
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .drawer {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 14;
      width: min(430px, calc(100vw - 36px));
      max-height: calc(100vh - 190px);
      overflow: auto;
      padding: 18px;
      pointer-events: auto;
    }

    .drawer[hidden] { display: none; }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .drawer h2 {
      margin: 0;
      color: var(--ink);
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .drawer-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink-2);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .drawer-section {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .drawer-section h3 {
      margin: 0 0 8px;
      color: var(--ink-2);
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .drawer-section p,
    .drawer-section li {
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.45;
    }

    .drawer-section ul {
      margin: 0;
      padding-left: 18px;
    }

    .drawer-section code {
      color: var(--primary-dark);
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .minimap {
      position: absolute;
      right: 18px;
      bottom: 88px;
      z-index: 11;
      width: 260px;
      height: 170px;
      padding: 10px;
      pointer-events: none;
    }

    .minimap svg {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: rgba(238, 246, 255, 0.84);
      border: 1px solid var(--line);
    }

    .mini-node {
      fill: rgba(59, 125, 216, 0.24);
      stroke: rgba(45, 104, 192, 0.45);
      stroke-width: 2;
    }

    .mini-node.existing { fill: rgba(21, 131, 77, 0.22); stroke: rgba(21, 131, 77, 0.45); }
    .mini-node.partial { fill: rgba(169, 107, 0, 0.2); stroke: rgba(169, 107, 0, 0.42); }
    .mini-node.missing { fill: rgba(184, 61, 61, 0.2); stroke: rgba(184, 61, 61, 0.42); }
    .mini-node.governance { fill: rgba(103, 88, 199, 0.2); stroke: rgba(103, 88, 199, 0.42); }

    #miniViewport {
      fill: rgba(59, 125, 216, 0.08);
      stroke: var(--primary-dark);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    @media (max-width: 820px) {
      .hud {
        width: calc(100vw - 36px);
      }

      .title-card {
        padding: 14px;
      }

      h1 {
        font-size: 27px;
      }

      .drawer {
        top: auto;
        bottom: 86px;
        max-height: 48vh;
      }

      .minimap {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="map-wrap" id="mapWrap" aria-label="Zoomable sports injury platform system map">
      <svg id="mapSvg" role="img" aria-labelledby="mapTitle mapDesc">
        <title id="mapTitle">Sports Injury Platform Zoomable System Map</title>
        <desc id="mapDesc">Pan and zoom architecture map showing app experience, assessment engine, clinical knowledge, rehab plan engine, check-in adaptation, governance, and infrastructure.</desc>
        <defs>
          <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
            <path d="M2,2 L12,7 L2,12 Z" fill="rgba(45,104,192,0.64)"></path>
          </marker>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(40,90,180,0.16)"></feDropShadow>
          </filter>
        </defs>
        <g id="viewport">
          <g id="grid"></g>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>

      <div class="hud">
        <section class="title-card">
          <span class="eyebrow">Zoomable architecture artifact</span>
          <h1>Sports Injury Platform System Map</h1>
          <p>Drag to pan. Scroll or pinch to zoom. Click any block for purpose, inputs, outputs, current repo evidence, missing pieces, and next build requirement.</p>
        </section>
        <section class="controls" aria-label="Map controls">
          <button type="button" data-zoom="in">Zoom in</button>
          <button type="button" data-zoom="out">Zoom out</button>
          <button type="button" id="fitBtn">Fit map</button>
          <button type="button" id="resetBtn">Reset</button>
          <span class="zoom-readout" id="zoomReadout">100%</span>
        </section>
        <section class="legend" aria-label="Status legend">
          <span><i class="dot existing"></i> Existing</span>
          <span><i class="dot partial"></i> Partial</span>
          <span><i class="dot missing"></i> Missing</span>
          <span><i class="dot governance"></i> Governance</span>
        </section>
      </div>

      <aside class="drawer" id="drawer" hidden aria-live="polite">
        <div class="drawer-head">
          <div>
            <span class="eyebrow" id="drawerStatus">Select a block</span>
            <h2 id="drawerTitle">System details</h2>
          </div>
          <button type="button" class="drawer-close" id="drawerClose" aria-label="Close details">x</button>
        </div>
        <div id="drawerBody"></div>
      </aside>

      <aside class="minimap" aria-hidden="true">
        <svg viewBox="0 0 260 170">
          <g id="miniNodes"></g>
          <rect id="miniViewport" x="0" y="0" width="60" height="40" rx="6"></rect>
        </svg>
      </aside>

      <nav class="focus-strip" aria-label="Focus map block">
        <button type="button" class="focus-btn" data-focus="journey">User journey</button>
        <button type="button" class="focus-btn" data-focus="assessment">Assessment engine</button>
        <button type="button" class="focus-btn" data-focus="clinical">Clinical knowledge</button>
        <button type="button" class="focus-btn" data-focus="plan">Plan engine</button>
        <button type="button" class="focus-btn" data-focus="checkin">Check-in</button>
        <button type="button" class="focus-btn" data-focus="governance">Governance</button>
        <button type="button" class="focus-btn" data-focus="infra">Infrastructure</button>
      </nav>
    </div>
  </div>

  <script>
    const world = { width: 2600, height: 1700 };

    const nodes = [
      {
        id: 'user',
        x: 90, y: 690, w: 240, h: 120,
        type: 'engine',
        kicker: 'Entry point',
        title: 'Athlete / injured active person',
        badge: 'user',
        body: 'Starts with symptoms, injury context, sport demands, goals, and daily response data.',
        chips: ['answers', 'symptoms', 'sport demand'],
        details: {
          Purpose: 'Represents the person moving through assessment, results, plan, daily session, logging, and progress tracking.',
          Inputs: ['Pain/symptoms', 'Mechanism', 'Sport context', 'Profile data', 'Session response'],
          Outputs: ['Assessment answers', 'Daily logs', 'Plan adherence', 'Progress context']
        }
      },
      {

        body: 'Visible flow across landing, anatomy, assessment, results, dashboard, plan, today session, exercise cards, logging, and progress.',
        chips: ['/anatomy', '/assessment', '/diagnosis', '/dashboard', '/plan'],
        details: {
          Purpose: 'Guide the athlete from start through assessment, result explanation, dashboard, full rehab plan, today session, exercise cards, daily logging, and progress tracking.',

          Existing: ['app/anatomy/page.jsx', 'app/assessment/page.jsx', 'app/diagnosis/page.jsx', 'app/dashboard/page.jsx', 'app/plan/page.jsx', 'app/check-in/page.jsx', 'app/coach/page.jsx', 'app/profile/page.jsx'],
          Missing: ['Full RF governed plan timeline: partial/not confirmed wired', 'Exercise cards backed by approved RF-EX adapter: missing/not confirmed', 'Clinician review UI: missing/not confirmed'],
          'Next build requirement': 'Define approved adapter boundary from governed clinical metadata into user-facing plan/session UI.'
        }
      },
      {
        id: 'assessment',
        x: 420, y: 575, w: 360, h: 430,
        type: 'partial',
        kicker: '2. Assessment engine',
        title: 'Assessment & Diagnosis Engine',
        badge: 'legacy runtime exists',
        body: 'Answer intake, red-flag screen, pattern matching, confidence, severity, affected area, recovery estimate, and differential patterns.',
        chips: ['confidence = match quality', 'severity != confidence', 'recovery estimate'],
        details: {
          Purpose: 'Turn structured assessment answers into bounded explanation, match-quality confidence, severity classification, affected area, differential patterns, and evidence-backed recovery-window concepts.',

          Existing: ['lib/injuryEngine/diagnosisEngine.js', 'lib/injuryEngine/safetyEngine.js', 'lib/injuryEngine/scoringEngine.js', 'docs/implementation/DIGITAL_ASSESSMENT_CONFIDENCE_AND_RESULTS_UX_POLICY.md', '38 RF rule objects'],
          Missing: ['Approved RF diagnosis adapter: missing/not confirmed', 'Approved severity/recovery rules wired into runtime: missing/not confirmed', 'Confidence cap implementation against RF policy: missing/not confirmed'],
          'Key distinction': ['Confidence = match quality', 'Severity = injury severity from answers/evidence', 'Recovery window = estimate from injury, severity, demand, and rules']
        }
      },
      {
        id: 'clinical',
        x: 930, y: 105, w: 470, h: 660,
        type: 'existing',
        kicker: '3. Governed metadata',
        title: 'Clinical Knowledge Systems',
        badge: 'built / not executable',
        body: 'Draft metadata systems for RF rules, assessments, capacities, evidence links, exercises, activity exposures, taxonomies, and prototype scenario.',
        chips: ['107 RF-EX', '12 RF-ACT', '18 RF-ASSESS', '15 CAP', '38 rules'],
        details: {
          Purpose: 'Separate what exists clinically from engines that prescribe or execute. These systems provide metadata, tags, evidence relationships, and boundaries.',
          Existing: ['RF clinical rules: 38', 'RF assessment knowledge: 18 RF-ASSESS', 'Capacity knowledge: 15 universal CAP / 0 RF-CAP overlays', 'Evidence linking: 1 map / 26 links', 'RF exercise knowledge: 107 RF-EX', 'RF activity exposure knowledge: 12 RF-ACT', 'Shared taxonomies: 10', 'Prototype plan scenario: 1'],
          Provides: ['Object identity', 'Classification', 'Purpose tags', 'Evidence relationships', 'Boundary notes', 'Reviewer-gating language', 'User-facing exercise-card metadata'],
          'Does not provide': ['Runtime diagnosis', 'Dosage prescription', 'Progression/regression authority', 'Readiness gates', 'RTT/RTS clearance', 'Runtime object selection'],
          Paths: ['lib/clinical/rf/rules/', 'lib/clinical/exerciseKnowledge/', 'lib/clinical/activityExposureKnowledge/', 'lib/clinical/assessmentKnowledge/', 'lib/clinical/capacityKnowledge/', 'lib/clinical/evidenceLinkingKnowledge/', 'lib/clinical/sharedKnowledgeTaxonomies/'],
          'Next build requirement': 'Create an approved clinical adapter contract before runtime consumes governed metadata.'
        }
      },
      {
        id: 'rules',
        x: 980, y: 830, w: 200, h: 145,
        type: 'existing',
        kicker: 'RF rules',
        title: '38 rule objects',
        badge: 'draft',
        body: 'Safety, diagnosis, severity, rehab, recurrence, field, and RTS governance.',
        chips: ['pending', 'not approved'],
        parent: 'clinical'
      },
      {
        id: 'assessKnowledge',
        x: 1210, y: 830, w: 220, h: 145,
        type: 'existing',
        kicker: 'Assessments',
        title: '18 RF-ASSESS',
        badge: 'draft',
        body: 'Screens, tests, response checks, diagnostic context, capacity-informing metadata.',
        chips: ['no diagnosis authority'],
        parent: 'clinical'
      },
      {
        id: 'capacity',
        x: 1460, y: 830, w: 220, h: 145,
        type: 'existing',
        kicker: 'Capacity',
        title: '15 CAP / 0 RF-CAP',
        badge: 'universal only',
        body: 'Walking, running, sprinting, kicking, strength, control, mobility, confidence.',

        parent: 'clinical'
      },
      {
        id: 'evidence',
        x: 1710, y: 830, w: 230, h: 145,
        type: 'existing',
        kicker: 'Evidence links',
        title: '1 map / 26 links',
        badge: 'metadata only',

      },
      {

        x: 980, y: 1015, w: 220, h: 150,
        type: 'existing',

      },
      {
        id: 'activity',
        x: 1230, y: 1015, w: 230, h: 150,
        type: 'existing',
        kicker: 'Exposure',
        title: '12 RF-ACT',
        badge: 'review gated',

      },
      {
        id: 'taxonomies',
        x: 1490, y: 1015, w: 210, h: 150,
        type: 'existing',

      },
      {

        type: 'existing',

        title: '1 static RF scenario',
        badge: 'inert',
        body: 'Prototype plan scenario for safe display concepts only.',
        chips: ['no runtime'],
        parent: 'clinical'
      },
      {
        id: 'plan',
        x: 1540, y: 130, w: 360, h: 500,
        type: 'missing',
        kicker: '4. Prescription layer',
        title: 'Rehab Plan & Prescription Engine',
        badge: 'missing / required',
        body: 'Future governed layer for prescription rules, phases, days, session builder, dosage, alternatives, stop rules, and progression/regression.',
        chips: ['prescription rule pack', 'phase model', 'session builder', 'dosage rules'],
        details: {

          Existing: ['lib/injuryEngine/rehabPlanGenerator.js', 'lib/injuryEngine/planAdapter.js', 'lib/injuryEngine/sessionScheduler.js', 'docs/implementation/REHAB_PLAN_COMPOSITION_ARCHITECTURE.md', '1 inert RF prototype scenario'],

      },
      {

      {

          Existing: ['scripts/check-rf-clinical-governance.mjs', 'scripts/check-rf-quarantine-boundary.mjs', 'scripts/validate-*.mjs', 'DIGITAL_ASSESSMENT_CONFIDENCE_AND_RESULTS_UX_POLICY.md'],

      {

        x: 1290, y: 1280, w: 590, h: 280,
        type: 'partial',
        kicker: '7. Platform state',
        title: 'Data, Media & App Infrastructure',
        badge: 'partial / not fully confirmed',
        body: 'User state, plan state, session state, check-in logs, media assets, Supabase, authentication, dashboard rendering, future clinician review.',
        chips: ['RecoveryContext', 'Supabase client', 'dashboard', 'media missing'],
        details: {
          Purpose: 'Store and render user/session/plan/check-in state, and later support video/media references and clinician review.',
          Existing: ['lib/supabaseClient.js', 'app/providers/RecoveryContext.jsx', 'components/sections/DashboardContent.jsx', 'components/sections/PlanContent.jsx', 'lib/injuryEngine/sessionScheduler.js'],
          Missing: ['Production RF data schema not confirmed', 'Media/video asset pipeline not confirmed', 'Clinician review storage not confirmed', 'Approved knowledge-object runtime cache not confirmed'],
          'Should not be touched yet': ['Do not wire draft clinical metadata into runtime', 'Do not create production tables before object governance is approved', 'Do not store unsupported clearance/readiness decisions'],

      },
      {
        id: 'validators',
        x: 2050, y: 1220, w: 360, h: 250,
        type: 'governance',
        kicker: 'Validation gates',
        title: 'Validator layer',
        badge: 'existing scripts',
        body: 'Checks object counts, inert status, schemas, boundary quarantine, and clinical governance.',
        chips: ['exercise', 'assessment', 'capacity', 'evidence', 'RF rules'],
        details: {
          Existing: ['validate:exercise-knowledge', 'validate:activity-exposure-knowledge', 'validate:assessment-knowledge', 'validate:capacity-knowledge', 'validate:evidence-linking-knowledge', 'validate:shared-knowledge-taxonomies', 'validate:prototype-plan-scenarios', 'check:rf-clinical', 'validate:rf-rules', 'check:rf-boundary'],
          Purpose: 'Keep metadata systems pending, non-executable, not approved, runtime-disconnected, and free of authority leakage.'
        }

    ];

    const edges = [
      ['user', 'journey', 'uses'],
      ['journey', 'assessment', 'answers'],
      ['assessment', 'clinical', 'consults metadata'],
      ['clinical', 'plan', 'candidate knowledge'],
      ['plan', 'checkin', 'today session'],
      ['checkin', 'assessment', 'response evidence'],
      ['clinical', 'governance', 'bounded by'],
      ['plan', 'governance', 'must pass', true],
      ['checkin', 'governance', 'safety review', true],
      ['infra', 'journey', 'renders state', true],
      ['infra', 'plan', 'plan/session state', true],
      ['validators', 'clinical', 'validate'],
      ['validators', 'governance', 'enforce'],
      ['assessment', 'infra', 'stores context', true],
      ['clinical', 'rules', '', true],
      ['clinical', 'assessKnowledge', '', true],
      ['clinical', 'capacity', '', true],
      ['assessKnowledge', 'evidence', 'links'],
      ['capacity', 'evidence', 'informs'],
      ['clinical', 'exercise', '', true],
      ['clinical', 'activity', '', true],
      ['clinical', 'taxonomies', '', true],
      ['clinical', 'prototype', '', true],
      ['exercise', 'plan', 'what exercise is'],
      ['activity', 'plan', 'withheld unless governed', true],
      ['prototype', 'plan', 'static scenario', true],
      ['taxonomies', 'exercise', 'tags'],
      ['taxonomies', 'activity', 'tags'],
      ['taxonomies', 'assessKnowledge', 'tags']
    ];

    const svg = document.getElementById('mapSvg');
    const wrap = document.getElementById('mapWrap');
    const viewport = document.getElementById('viewport');
    const grid = document.getElementById('grid');
    const edgeLayer = document.getElementById('edges');
    const nodeLayer = document.getElementById('nodes');
    const zoomReadout = document.getElementById('zoomReadout');
    const drawer = document.getElementById('drawer');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerStatus = document.getElementById('drawerStatus');
    const drawerBody = document.getElementById('drawerBody');
    const miniNodes = document.getElementById('miniNodes');
    const miniViewport = document.getElementById('miniViewport');

    let state = { scale: 0.52, x: 44, y: 26 };
    let dragging = false;
    let dragStart = null;

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function center(node) {
      return { x: node.x + node.w / 2, y: node.y + node.h / 2 };
    }

    function getNode(id) {
      return nodes.find((node) => node.id === id);
    }

    function drawGrid() {
      const step = 100;
      let html = '';
      for (let x = 0; x <= world.width; x += step) {
        html += `<line class="grid-line" x1="${x}" y1="0" x2="${x}" y2="${world.height}"></line>`;
      }
      for (let y = 0; y <= world.height; y += step) {
        html += `<line class="grid-line" x1="0" y1="${y}" x2="${world.width}" y2="${y}"></line>`;
      }
      grid.innerHTML = html;
    }

    function drawEdges() {
      edgeLayer.innerHTML = edges.map(([fromId, toId, label, dashed]) => {
        const from = center(getNode(fromId));
        const to = center(getNode(toId));
        const dx = Math.abs(to.x - from.x);
        const c1x = from.x + Math.max(80, dx * 0.42);
        const c2x = to.x - Math.max(80, dx * 0.42);
        const midX = (from.x + to.x) / 2;
        const midY = (from.y + to.y) / 2 - 10;
        return `
          <path class="edge ${dashed ? 'dashed' : ''}" marker-end="url(#arrow)" d="M ${from.x} ${from.y} C ${c1x} ${from.y}, ${c2x} ${to.y}, ${to.x} ${to.y}"></path>
          ${label ? `<text class="edge-label" x="${midX}" y="${midY}" text-anchor="middle">${escapeHtml(label)}</text>` : ''}
        `;
      }).join('');
    }

    function drawNodes() {
      nodeLayer.innerHTML = nodes.map((node) => `
        <foreignObject x="${node.x}" y="${node.y}" width="${node.w}" height="${node.h}">
          <div class="node-card ${node.type}" data-node="${node.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(node.title)} details">
            <div class="node-top">
              <span class="node-kicker">${escapeHtml(node.kicker)}</span>
              <span class="node-badge">${escapeHtml(node.badge)}</span>
            </div>
            <h2 class="node-title">${escapeHtml(node.title)}</h2>
            <p class="node-body">${escapeHtml(node.body)}</p>
            <div class="node-list">
              ${node.chips.map((chip) => `<span>${escapeHtml(chip)}</span>`).join('')}
            </div>
          </div>
        </foreignObject>
      `).join('');

      document.querySelectorAll('[data-node]').forEach((el) => {
        el.addEventListener('click', (event) => {
          event.stopPropagation();
          openDrawer(getNode(el.dataset.node));
        });
        el.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openDrawer(getNode(el.dataset.node));
          }
        });
      });
    }

    function drawMiniMap() {
      const sx = 260 / world.width;
      const sy = 170 / world.height;
      miniNodes.innerHTML = nodes.map((node) => `
        <rect class="mini-node ${node.type}" x="${node.x * sx}" y="${node.y * sy}" width="${node.w * sx}" height="${node.h * sy}" rx="4"></rect>
      `).join('');
      updateMiniViewport();
    }

    function applyTransform() {
      viewport.setAttribute('transform', `translate(${state.x} ${state.y}) scale(${state.scale})`);
      zoomReadout.textContent = `${Math.round(state.scale * 100)}%`;
      updateMiniViewport();
    }

    function updateMiniViewport() {
      const sx = 260 / world.width;
      const sy = 170 / world.height;
      const rect = svg.getBoundingClientRect();
      const x = (-state.x / state.scale) * sx;
      const y = (-state.y / state.scale) * sy;
      const w = (rect.width / state.scale) * sx;
      const h = (rect.height / state.scale) * sy;
      miniViewport.setAttribute('x', Math.max(0, Math.min(260, x)));
      miniViewport.setAttribute('y', Math.max(0, Math.min(170, y)));
      miniViewport.setAttribute('width', Math.max(8, Math.min(260, w)));
      miniViewport.setAttribute('height', Math.max(8, Math.min(170, h)));
    }

    function zoomAt(clientX, clientY, factor) {
      const rect = svg.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;
      const worldX = (px - state.x) / state.scale;
      const worldY = (py - state.y) / state.scale;
      const nextScale = Math.max(0.22, Math.min(2.8, state.scale * factor));
      state.x = px - worldX * nextScale;
      state.y = py - worldY * nextScale;
      state.scale = nextScale;
      applyTransform();
    }

    function fitMap() {
      const rect = svg.getBoundingClientRect();
      const scale = Math.min(rect.width / world.width, rect.height / world.height) * 0.88;
      state.scale = Math.max(0.22, Math.min(2.8, scale));
      state.x = (rect.width - world.width * state.scale) / 2;
      state.y = (rect.height - world.height * state.scale) / 2;
      applyTransform();
    }

    function focusNode(id) {
      const node = getNode(id);
      if (!node) return;
      const rect = svg.getBoundingClientRect();
      const desiredScale = Math.min(1.15, Math.max(0.58, Math.min(rect.width / (node.w * 2.2), rect.height / (node.h * 2.2))));
      state.scale = desiredScale;
      state.x = rect.width / 2 - (node.x + node.w / 2) * state.scale;
      state.y = rect.height / 2 - (node.y + node.h / 2) * state.scale;
      applyTransform();
      openDrawer(node);
    }

    function openDrawer(node) {
      drawer.hidden = false;
      drawerTitle.textContent = node.title;
      drawerStatus.textContent = `${node.kicker} / ${node.badge}`;
      const details = node.details || {
        Purpose: node.body,
        Status: [node.badge],
        Notes: node.chips
      };
      drawerBody.innerHTML = Object.entries(details).map(([heading, value]) => {
        const content = Array.isArray(value)
          ? `<ul>${value.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`
          : `<p>${escapeHtml(value)}</p>`;
        return `<section class="drawer-section"><h3>${escapeHtml(heading)}</h3>${content}</section>`;
      }).join('');
    }

    function init() {
      drawGrid();
      drawEdges();
      drawNodes();
      drawMiniMap();
      fitMap();

      wrap.addEventListener('wheel', (event) => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 0.88;
        zoomAt(event.clientX, event.clientY, factor);
      }, { passive: false });

      wrap.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.hud, .drawer, .focus-strip')) return;
        dragging = true;
        wrap.classList.add('dragging');
        dragStart = { x: event.clientX, y: event.clientY, sx: state.x, sy: state.y };
        wrap.setPointerCapture(event.pointerId);
      });

      wrap.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        state.x = dragStart.sx + event.clientX - dragStart.x;
        state.y = dragStart.sy + event.clientY - dragStart.y;
        applyTransform();
      });

      wrap.addEventListener('pointerup', (event) => {
        dragging = false;
        wrap.classList.remove('dragging');
        if (wrap.hasPointerCapture(event.pointerId)) wrap.releasePointerCapture(event.pointerId);
      });

      wrap.addEventListener('dblclick', (event) => {
        if (event.target.closest('.hud, .drawer, .focus-strip')) return;
        zoomAt(event.clientX, event.clientY, 1.45);
      });

      document.querySelector('[data-zoom="in"]').addEventListener('click', () => {
        const rect = svg.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.18);
      });

      document.querySelector('[data-zoom="out"]').addEventListener('click', () => {
        const rect = svg.getBoundingClientRect();
        zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.82);
      });

      document.getElementById('fitBtn').addEventListener('click', fitMap);
      document.getElementById('resetBtn').addEventListener('click', () => {
        state = { scale: 0.52, x: 44, y: 26 };
        fitMap();
        drawer.hidden = true;
      });
      document.getElementById('drawerClose').addEventListener('click', () => { drawer.hidden = true; });
      document.querySelectorAll('[data-focus]').forEach((button) => {
        button.addEventListener('click', () => focusNode(button.dataset.focus));
      });
      window.addEventListener('resize', fitMap);
    }

    init();
  </script>
